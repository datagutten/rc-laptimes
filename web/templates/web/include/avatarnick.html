{% load static %}
{% if transponder.avatar %}
    <img src="{{ transponder.avatar.url }}" alt="avatar" class="avatar"/>
{% else %}
    <img src="{% static 'web/avatar_fallback.png' %}" alt="default avatar" class="avatar">
{% endif %}
{% if transponder.name %}
    {{ transponder.name }}
{% else %}
    {{ transponder.number }}
{% endif %}
